name: monitor

on:
  schedule:
    # Every 5 minutes, offset from the :00/:05 marks that GitHub's scheduler
    # is most congested on. GitHub may still delay or skip runs under load.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print instead of send, do not commit state)"
        type: boolean
        default: false
      force_digest:
        description: "Send the Moderate digest now"
        type: boolean
        default: false
      test_delivery:
        description: "Only send a test email + text to verify secrets"
        type: boolean
        default: false

# Never let two runs race on seen.json.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force_digest }}" = "true" ]; then ARGS="$ARGS --force-digest"; fi
          if [ "${{ inputs.test_delivery }}" = "true" ]; then ARGS="$ARGS --test-delivery"; fi
          python monitor.py $ARGS

      - name: Commit state file
        if: ${{ inputs.dry_run != true && inputs.test_delivery != true }}
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add seen.json alerts/recent.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed, rebasing and retrying ($i)..."
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "Could not push state after 3 attempts" >&2
          exit 1

      - name: Email on job failure
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: pip install -q -r requirements.txt && python monitor.py --report-failure
